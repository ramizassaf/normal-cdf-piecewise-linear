name: build
# Recomputes every statistic, regenerates figures, tables and the app,
# runs the tests, compiles the paper, and commits the outputs back.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python packages
        run: pip install -r requirements.txt
      - name: Install LaTeX and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended \
            texlive-latex-extra texlive-fonts-recommended fonts-texgyre
      - name: Compute results
        run: python analysis/compute_results.py > /dev/null
      - name: Figures, tables, app
        run: |
          python analysis/make_figures.py
          python analysis/make_tables.py
          python app/build_app.py
      - name: Tests
        run: pytest -q
      - name: Compile paper
        working-directory: paper
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          mv main.pdf Assaf_2026_PWL_Normal_CDF_v2.pdf
          rm -f main.aux main.log main.out
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper/Assaf_2026_PWL_Normal_CDF_v2.pdf paper/figures paper/tables docs results
          git diff --cached --quiet || git commit -m "Build paper, figures, tables and app"
          git push
